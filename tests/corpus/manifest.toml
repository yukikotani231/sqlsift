# Real-world SQL corpus for sqlsift (dbt projects and warehouse dialects).
#
# Nothing here is vendored: `fetch.py` clones each project with `git clone --depth 1`
# into `tests/corpus/repos/` (git-ignored) and records the checked-out commit in
# `tests/corpus/out/lock.json`. See README.md for the workflow.
#
# [[project]] fields:
#   name        short id (directory name under repos/)
#   url         git URL
#   sha         commit the last report was produced from (fetch.py warns when HEAD moved)
#   license     SPDX id of the project's license ("none" = no license file; the project
#               is only read, never vendored)
#   kind        "dbt" (Jinja models: --templating jinja) or "sql" (plain SQL files)
#   dialects    dialects the files are checked with. dbt packages that support several
#               warehouses (dispatch macros) are checked with each of them
#   root        directory of the project inside the repo (default: repo root)
#   models      globs of query files, relative to `root`
#   exclude     globs (relative to `root`) of files not to check
#   schema      how the schema catalog is obtained:
#                 "dbt-run" run dbt (seed + run + docs generate) against a local
#                           PostgreSQL and turn target/catalog.json into DDL; compiled
#                           models are checked too ("compiled" mode, PostgreSQL)
#                 "yml"     columns declared in sources/models .yml files (type
#                           `data_type` when given, else unknown) + seed CSV headers
#                 "ddl"     CREATE TABLE files of the repo (`schema_files` globs)
#                 "bq-yaml" bigquery-etl schema.yaml files next to each query
#                 "none"    no schema: only parse coverage is measured
#   dbt_project directory (relative to `root`) dbt is run from for "dbt-run"
#               (fivetran packages: integration_tests)
#   dbt_schema  target schema of the dbt profile (default "corpus")
#   dbt_vars    --vars passed to every dbt command (YAML/JSON string)
#   deps        names of [[dependency]] entries installed into dbt_packages/ for
#               "dbt-run" (dbt hub is not reachable from the sandbox, so `dbt deps`
#               is replaced by local clones)
#
# [[dependency]]: dbt packages cloned into repos/_deps/<name> (`ref`: branch or tag,
# default the default branch).

# --- dbt projects, PostgreSQL-runnable (highest fidelity: real catalog.json) -------

[[project]]
name = "jaffle-shop"
url = "https://github.com/dbt-labs/jaffle-shop"
sha = "5beb145b00f5"
license = "none"
kind = "dbt"
dialects = ["postgresql", "snowflake", "bigquery", "redshift", "databricks"]
models = ["models/**/*.sql"]
schema = "dbt-run"
dbt_project = "."
deps = ["dbt_utils", "audit_helper"]
dbt_vars = '{"load_source_data": true}'

