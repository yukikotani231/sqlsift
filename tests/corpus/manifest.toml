# --- app-developer projects: sqlc, Prisma TypedSQL, postgres.js, Supabase, MySQL ---------
#
# Application repositories whose queries run against a schema built from their own
# migrations (`schema_dir`) or schema files, the way an app developer runs sqlsift.
# Every one of these queries is run by the application, so a diagnostic is a real bug,
# a false positive, or a gap in the schema the harness gives (see README.md).

# sqlc (Go), PostgreSQL

[[project]]
name = "loop"
url = "https://github.com/lightninglabs/loop"
sha = "6c28841284af"
license = "MIT"
kind = "sql"
dialects = ["postgresql"]
models = ["loopdb/sqlc/queries/*.sql"]
schema = "none"
schema_dir = "loopdb/sqlc/migrations"
# loopdb/postgres.go replaces these in the (SQLite-flavored) migrations on PostgreSQL
schema_rewrite = [["BLOB", "BYTEA"], ["INTEGER PRIMARY KEY", "SERIAL PRIMARY KEY"]]

[[project]]
name = "xmtpd"
url = "https://github.com/xmtp/xmtpd"
sha = "822ddc956a44"
license = "MIT"
kind = "sql"
dialects = ["postgresql"]
models = ["pkg/db/sqlc/*.sql"]
schema = "none"
schema_dir = "pkg/db/migrations"

[[project]]
name = "hatchet"
url = "https://github.com/hatchet-dev/hatchet"
sha = "82fce9703e35"
license = "MIT"
kind = "sql"
dialects = ["postgresql"]
models = ["pkg/repository/sqlcv1/*.sql"]
exclude = ["pkg/repository/sqlcv1/concurrency-additional-tables.sql"]
# the schema of sqlc.yaml
schema = "ddl"
schema_files = [
  "sql/schema/v0.sql",
  "sql/schema/v1-core.sql",
  "sql/schema/v1-olap.sql",
  "sql/schema/pg-stubs.sql",
  "pkg/repository/sqlcv1/concurrency-additional-tables.sql",
]

