[workspace]
resolver = "2"
members = ["crates/sqlsift-core", "crates/sqlsift-cli", "crates/sqlsift-lsp", "crates/sqlsift-wasm"]

[workspace.package]
version = "0.1.4"
edition = "2021"
license = "MIT"
repository = "https://github.com/yukikotani231/sqlsift"
rust-version = "1.75"

[workspace.dependencies]
# Parser
sqlparser = { version = "0.53", features = ["visitor"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Error handling
thiserror = "2.0"
miette = { version = "7.4", features = ["fancy"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Utilities
indexmap = { version = "2.7", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
glob = "0.3"

# Async / LSP
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }

# Internal crates
sqlsift-core = { path = "crates/sqlsift-core", version = "0.1.4" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Too noisy for this codebase
must_use_candidate = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
# Flags product names such as PostgreSQL as code
doc_markdown = "allow"
# Type mapping tables read better with one arm per type
match_same_arms = "allow"
# `assert!(v.is_empty())` reads better than `assert_eq!(v, [] as [T; 0])`
assert_is_empty = "allow"
# Line/column numbers (u64 in sqlparser, u32 in LSP) always fit
cast_possible_truncation = "allow"
# `use Enum::*` inside a function keeps long matches readable
enum_glob_use = "allow"
