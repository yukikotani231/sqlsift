# cargo-about: license notices of the crates compiled into the sqlsift binaries,
# the npm package, the VS Code extension and the playground (THIRD-PARTY-LICENSES.md).
# Regenerate after changing dependencies:
#   cargo about generate --workspace --locked about.hbs -o THIRD-PARTY-LICENSES.md
# CI ("Licenses") fails when the committed file is out of date.

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false
private = { ignore = true }

# miniz_oxide has both LICENSE and LICENSE-MIT.md (MIT); without this the file
# picked depends on the directory order, so the output differs between machines.
[miniz_oxide.clarify]
license = "MIT"

[[miniz_oxide.clarify.files]]
path = "LICENSE-MIT.md"
license = "MIT"
checksum = "799e9ca9d179295ef372f25d3769cdda7d25bb2668add6a6a1e22d1e4c678b8d"

# libmimalloc-sys has the binding's LICENSE.txt and mimalloc's own LICENSE (the
# Microsoft C code compiled into the binary, under c_src/mimalloc/v2 and v3); pin
# the latter so the notice doesn't depend on the directory order.
[libmimalloc-sys.clarify]
license = "MIT"

[[libmimalloc-sys.clarify.files]]
path = "c_src/mimalloc/v2/LICENSE"
license = "MIT"
checksum = "82ade5d7d9b029044b5fbbc326207fc47c2d44ee4dd71e8a559c36d728217de9"
