# cargo-about: license notices of the crates compiled into the sqlsift binaries,
# the npm package, the VS Code extension and the playground (THIRD-PARTY-LICENSES.md).
# Regenerate after changing dependencies:
#   cargo about generate --workspace --locked about.hbs -o THIRD-PARTY-LICENSES.md
# CI ("Licenses") fails when the committed file is out of date.

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false
private = { ignore = true }
