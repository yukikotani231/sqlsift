name: "sqlsift"
description: "Check raw SQL queries against your schema — missing tables, typo'd columns, type mismatches. No database required."
author: "yukikotani231"
branding:
  icon: "database"
  color: "green"

inputs:
  files:
    description: "Query files to check (space-separated paths or glob patterns, e.g. `queries/**/*.sql`). Optional when `files` is set in sqlsift.toml."
    required: false
    default: ""
  schema:
    description: "Schema files (space-separated paths or glob patterns). Optional when configured in sqlsift.toml."
    required: false
    default: ""
  schema-dir:
    description: "Directory of schema/migration files, applied in filename order."
    required: false
    default: ""
  dialect:
    description: "SQL dialect: postgresql, mysql or sqlite."
    required: false
    default: ""
  config:
    description: "Path to sqlsift.toml (auto-discovered when omitted)."
    required: false
    default: ""
  disable:
    description: "Rules to disable (space-separated, e.g. `E0006 E0008`)."
    required: false
    default: ""
  sarif-file:
    description: "Also write a SARIF report to this path (for github/codeql-action/upload-sarif)."
    required: false
    default: ""
  fail-on-error:
    description: "Fail the step when sqlsift reports errors."
    required: false
    default: "true"
  diff-base:
    description: "Report only the diagnostics that are new compared with this git ref (branch, tag or commit), e.g. `${{ github.base_ref }}` on pull requests. Diagnostics that already occur at that ref are hidden. Empty (the default, and what `github.base_ref` is outside pull requests): report every diagnostic."
    required: false
    default: ""
  version:
    description: "sqlsift-cli version to run from npm."
    required: false
    default: "latest"
  cli-path:
    description: "Use an existing sqlsift binary instead of installing from npm (advanced)."
    required: false
    default: ""

outputs:
  exit-code:
    description: "sqlsift exit code: 0 = no errors, 1 = errors found, 2 = usage/configuration error."
    value: ${{ steps.check.outputs.exit-code }}

runs:
  using: "composite"
  steps:
    - id: check
      shell: bash
      env:
        INPUT_FILES: ${{ inputs.files }}
        INPUT_SCHEMA: ${{ inputs.schema }}
        INPUT_SCHEMA_DIR: ${{ inputs.schema-dir }}
        INPUT_DIALECT: ${{ inputs.dialect }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_DISABLE: ${{ inputs.disable }}
        INPUT_SARIF_FILE: ${{ inputs.sarif-file }}
        INPUT_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_CLI_PATH: ${{ inputs.cli-path }}
        INPUT_DIFF_BASE: ${{ inputs.diff-base }}
        MATCHER: ${{ github.action_path }}/.github/sqlsift-problem-matcher.json
      run: |
        set -o pipefail

        if [[ -n "$INPUT_CLI_PATH" ]]; then
          # Made absolute, as the diff-base run below works in another directory
          if [[ "$INPUT_CLI_PATH" != /* && -e "$INPUT_CLI_PATH" ]]; then
            INPUT_CLI_PATH="$PWD/$INPUT_CLI_PATH"
          fi
          cli=("$INPUT_CLI_PATH")
        else
          cli=(npx --yes "sqlsift-cli@${INPUT_VERSION}")
        fi

        # Inputs are passed through the environment and split into words here, so
        # they are never interpreted as shell code. Globs are expanded by sqlsift.
        args=(check)
        read -ra patterns <<< "$INPUT_SCHEMA"
        for p in "${patterns[@]}"; do args+=(--schema "$p"); done
        [[ -n "$INPUT_SCHEMA_DIR" ]] && args+=(--schema-dir "$INPUT_SCHEMA_DIR")
        [[ -n "$INPUT_DIALECT" ]] && args+=(--dialect "$INPUT_DIALECT")
        [[ -n "$INPUT_CONFIG" ]] && args+=(--config "$INPUT_CONFIG")
        read -ra rules <<< "$INPUT_DISABLE"
        for r in "${rules[@]}"; do args+=(--disable "$r"); done
        read -ra files <<< "$INPUT_FILES"

        # diff-base: check the base commit in a temporary worktree, record its
        # diagnostics in a temporary baseline, then check this commit against
        # it, so that only the diagnostics this change introduces are reported.
        # On a pull_request checkout HEAD is the merge commit, so comparing it
        # with the base branch tip shows what merging the PR would add. Only the
        # base repository is fetched, so fork PRs need no extra token.
        if [[ -n "$INPUT_DIFF_BASE" ]]; then
          base_tree="${RUNNER_TEMP:-/tmp}/sqlsift-diff-base-$$"
          # A baseline names files relative to its own directory, so it is
          # written in the base worktree's copy of the current directory and
          # read from the current directory
          baseline_name=".sqlsift-diff-baseline-$$.json"
          prefix=$(git rev-parse --show-prefix)
          cleanup() {
            rm -f "$baseline_name"
            git worktree remove --force "$base_tree" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          # (a shallow checkout, the actions/checkout default, stays shallow; a
          # full one is not made shallow)
          depth=""
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then depth="--depth=1"; fi
          # A commit SHA that is already here is used as is; anything else (a
          # branch, a tag, a SHA the shallow checkout lacks) is fetched from
          # origin, falling back to a local ref
          if [[ "$INPUT_DIFF_BASE" =~ ^[0-9a-f]{40}$ ]] \
            && base_commit=$(git rev-parse --verify --quiet "${INPUT_DIFF_BASE}^{commit}"); then
            :
          elif git fetch --quiet --no-tags ${depth:+"$depth"} origin "$INPUT_DIFF_BASE" 2>/dev/null; then
            base_commit=$(git rev-parse FETCH_HEAD)
          elif base_commit=$(git rev-parse --verify --quiet "${INPUT_DIFF_BASE}^{commit}"); then
            :
          else
            echo "::error::sqlsift: diff-base '${INPUT_DIFF_BASE}' is neither a ref of origin nor a local commit"
            echo "exit-code=2" >> "$GITHUB_OUTPUT"
            exit 2
          fi
          git worktree add --quiet --detach "$base_tree" "$base_commit"
          echo "Comparing with ${INPUT_DIFF_BASE} (${base_commit:0:12}): only new diagnostics are reported"
          set +e
          (cd "$base_tree/$prefix" && NO_COLOR=1 "${cli[@]}" "${args[@]}" --quiet \
            --write-baseline --baseline "$baseline_name" "${files[@]}" 2>&1)
          base_code=$?
          set -e
          if [[ "$base_code" -eq 0 && -f "$base_tree/$prefix/$baseline_name" ]]; then
            cp "$base_tree/$prefix/$baseline_name" "$baseline_name"
          else
            # E.g. no sqlsift.toml or no query files yet at the base: all is new
            echo "::warning::sqlsift could not check ${INPUT_DIFF_BASE} (exit code ${base_code}); reporting every diagnostic"
            echo '{"version":2,"entries":[]}' > "$baseline_name"
          fi
          args+=(--baseline "$baseline_name")
        fi

        # Inline annotations on the pull request diff
        echo "::add-matcher::${MATCHER}"
        set +e
        # (in diff-base mode the note about baseline entries that no longer occur
        # only means problems were fixed, so it is left out)
        NO_COLOR=1 "${cli[@]}" "${args[@]}" --max-errors 0 "${files[@]}" 2>&1 | {
          if [[ -n "$INPUT_DIFF_BASE" ]]; then grep -v '^Note: .*baseline entr' || true; else cat; fi
        }
        code=${PIPESTATUS[0]}
        set -e
        echo "::remove-matcher owner=sqlsift::"

        if [[ -n "$INPUT_SARIF_FILE" ]]; then
          # (diagnostics were already printed above)
          "${cli[@]}" "${args[@]}" --max-errors 0 --format sarif "${files[@]}" > "$INPUT_SARIF_FILE" 2>/dev/null || true
        fi

        echo "exit-code=${code}" >> "$GITHUB_OUTPUT"
        if [[ "$code" -ne 0 && ( "$INPUT_FAIL_ON_ERROR" == "true" || "$code" -ne 1 ) ]]; then
          exit "$code"
        fi
