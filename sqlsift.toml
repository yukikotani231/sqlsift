# sqlsift configuration file
# Place this file in your project root.
# Relative paths are resolved against the directory containing this file.

# Schema definition files (supports glob patterns)
schema = [
    "tests/fixtures/schema.sql",
]

# Query files to check (supports glob patterns)
# files = [
#     "app/queries/**/*.sql",
#     "db/queries/**/*.sql",
# ]

# Tagged template literals checked as SQL in TypeScript / JavaScript query files
# (.ts, .tsx, .js, .jsx, .mts, .cts). A tag matches the last identifier of the
# tag expression: "sql" matches sql`...`, db.sql`...` and Prisma.sql`...`, and
# "$queryRaw" matches prisma.$queryRaw`...`. Default: ["sql"].
# embedded_sql_tags = ["sql", "$queryRaw", "$executeRaw"]

# Query files to skip, whether they come from `files` or the command line
# (glob patterns; `**` matches any number of directories, and a directory
# pattern skips everything below it). `--ignore <PATTERN>` adds to this list.
# ignore = [
#     "sql/archive/**",
#     "**/*.generated.sql",
# ]

# Or use schema directory to automatically include all .sql files
# schema_dir = "db/schema"

# SQL dialect: "postgresql" (default), "mysql", or "sqlite"
# dialect = "postgresql"

# Output format: "human", "json", "sarif", or "github" (GitHub Actions annotations)
# format = "human"

# Fail the check (exit 1) when more than this many warnings are reported.
# Use 0 to fail on any warning without turning warnings into errors.
# max_warnings = 0

# Disable specific rules (codes or names)
# disable = ["E0001", "column-not-found"]

# Rule levels: "off", "warn" (reported, doesn't fail the check) or "error".
# List rules with `sqlsift rules`.
# [rules]
# E0006 = "warn"
# missing-required-column = "off"

# Levels of whole categories: correctness (default error), suspicious (warn),
# pedantic, style, restriction (off). A rule's own level wins.
# [categories]
# correctness = "error"
