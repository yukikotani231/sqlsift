[package]
name = "sqlsift-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "WebAssembly bindings for sqlsift (powers the browser playground)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sqlsift-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# Must match the wasm-bindgen CLI version used by scripts/build-playground.sh
# and .github/workflows/pages.yml.
wasm-bindgen = "=0.2.100"

# Not a distributable binary; keep cargo-dist from picking it up.
[package.metadata.dist]
dist = false
