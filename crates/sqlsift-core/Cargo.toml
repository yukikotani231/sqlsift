[package]
name = "sqlsift-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core library for SQL static analysis against schema definitions"
keywords = ["sql", "static-analysis", "linter", "validation", "postgresql"]
categories = ["development-tools", "database"]
readme = "../../README.md"

[dependencies]
sqlparser.workspace = true
sqlsift-ast = { path = "../sqlsift-ast", features = ["sqlparser"] }
thiserror.workspace = true
miette.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
tracing.workspace = true
glob.workspace = true
# Experimental (#257): the in-house PostgreSQL parser, behind the `inhouse-parser` feature.
sqlsift-parser = { path = "../sqlsift-parser", optional = true }

[dev-dependencies]
pretty_assertions = "1.4"

[features]
inhouse-parser = ["dep:sqlsift-parser"]

[lints]
workspace = true
