[package]
name = "sqlx-example"
version = "0.1.0"
edition = "2021"
publish = false

# Not built in sqlsift's CI: only the SQL is checked (scripts/check-examples.sh).
# Building it needs DATABASE_URL or a `cargo sqlx prepare` cache, as any sqlx
# project does.
[workspace]

[dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid"] }
chrono = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = "1"
