name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token: these jobs only build and test
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
        exclude:
          - os: macos-latest
            rust: beta
          - os: windows-latest
            rust: beta
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --all-targets

      - name: Run tests
        run: cargo test --all-targets

      - name: Run doctests
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: cargo test --doc

      # Experimental in-house PostgreSQL parser (#257), not in releases
      - name: Run tests with the in-house parser
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: cargo test -p sqlsift-core --features inhouse-parser --test inhouse_parser_tests

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy with the in-house parser
        run: cargo clippy --all-targets --features sqlsift-cli/inhouse-parser -- -D warnings

  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Dependency licenses must be in the allow list of deny.toml
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.8.2

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      # The notices shipped with the binaries and the VS Code extension must match
      # the dependencies; run scripts/third-party-licenses.sh after changing them.
      - name: Check third-party notices are up to date
        run: |
          cargo fetch --locked
          (cd editors/vscode && npm ci --ignore-scripts)
          scripts/third-party-licenses.sh
          git diff --exit-code -- THIRD-PARTY-LICENSES.md editors/vscode/THIRD-PARTY-NOTICES.md

  examples:
    name: Example projects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Build sqlsift
        run: cargo build -p sqlsift-cli

      # Each example's own queries must be clean, and its broken/ files must
      # report exactly the diagnostics in its expected-diagnostics.txt.
      - name: Check example projects
        run: scripts/check-examples.sh

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Build documentation
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
