name: Publish VS Code Extension

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.2); ignored in identity mode"
        required: false
      identity:
        description: "Only sign in to the Marketplace and print the identity to add to the publisher's Members"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-vsix:
    name: Build VSIX (${{ matrix.vscode_target }})
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_dispatch' && !inputs.identity) ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch != null &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust_target: aarch64-apple-darwin
            vscode_target: darwin-arm64
            archive_ext: tar.xz
            binary_name: sqlsift-lsp
          - rust_target: x86_64-apple-darwin
            vscode_target: darwin-x64
            archive_ext: tar.xz
            binary_name: sqlsift-lsp
          - rust_target: x86_64-unknown-linux-gnu
            vscode_target: linux-x64
            archive_ext: tar.xz
            binary_name: sqlsift-lsp
          - rust_target: aarch64-unknown-linux-gnu
            vscode_target: linux-arm64
            archive_ext: tar.xz
            binary_name: sqlsift-lsp
          - rust_target: x86_64-pc-windows-msvc
            vscode_target: win32-x64
            archive_ext: zip
            binary_name: sqlsift-lsp.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20.x"

      # The tag comes in through env, not an expression in the script: a branch name is
      # attacker-controlled text (Release also runs on pull requests from forks).
      - name: Determine release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="$RUN_BRANCH"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Not a release tag: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Update extension version
        working-directory: editors/vscode
        run: npm version "${{ steps.tag.outputs.version }}" --no-git-tag-version

      - name: Install dependencies
        working-directory: editors/vscode
        run: npm ci

      - name: Download sqlsift-lsp binary from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARCHIVE="sqlsift-lsp-${{ matrix.rust_target }}.${{ matrix.archive_ext }}"
          gh release download "${{ steps.tag.outputs.tag }}" \
            --pattern "$ARCHIVE" \
            --dir /tmp/download

          mkdir -p /tmp/extracted editors/vscode/bin

          if [[ "${{ matrix.archive_ext }}" == "tar.xz" ]]; then
            tar xf "/tmp/download/$ARCHIVE" -C /tmp/extracted
          else
            unzip "/tmp/download/$ARCHIVE" -d /tmp/extracted
          fi

          BINARY=$(find /tmp/extracted -name "${{ matrix.binary_name }}" -type f | head -1)
          cp "$BINARY" editors/vscode/bin/
          chmod +x "editors/vscode/bin/${{ matrix.binary_name }}"

      - name: Copy LICENSE
        run: cp LICENSE THIRD-PARTY-LICENSES.md editors/vscode/

      - name: Typecheck extension
        working-directory: editors/vscode
        run: npx tsc --noEmit -p .

      - name: Bundle extension
        working-directory: editors/vscode
        run: npm run esbuild

      - name: Build VSIX
        working-directory: editors/vscode
        run: npx @vscode/vsce package --target ${{ matrix.vscode_target }}

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix-${{ matrix.vscode_target }}
          path: editors/vscode/*.vsix

  # Signs in with GitHub OIDC to a Microsoft Entra ID app (no stored token; global
  # Azure DevOps PATs are retired on 2026-12-01). See PUBLISHING.md for the setup.
  marketplace:
    name: Publish to VS Code Marketplace
    needs: build-vsix
    # Run on its own in identity mode, where build-vsix is skipped.
    if: >
      always() && vars.PUBLISH_VSCODE == 'true' &&
      (needs.build-vsix.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.identity))
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    permissions:
      id-token: write
    steps:
      - name: Sign in to Microsoft Entra ID
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # The id to add to the publisher's Members (Contributor). Only readable while
      # signed in as the identity; connectionData works for service principals too.
      - name: Show Marketplace identity
        run: |
          az rest -u "https://app.vssps.visualstudio.com/_apis/connectionData" \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query "authenticatedUser.{id: id, name: providerDisplayName}"

      - name: Verify publish rights
        run: npx -y @vscode/vsce@3 verify-pat --azure-credential sqlsift

      - name: Download all VSIX artifacts
        if: needs.build-vsix.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vsix-*
          path: vsix/
          merge-multiple: true

      - name: Publish to VS Code Marketplace
        if: needs.build-vsix.result == 'success'
        run: npx -y @vscode/vsce@3 publish --azure-credential --skip-duplicate --packagePath vsix/*.vsix
