name: Publish VS Code Extension

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.2); ignored in identity mode"
        required: false
      identity:
        description: "Only sign in to the Marketplace and print the identity to add to the publisher's Members"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-vsix:
    name: Build VSIX (${{ matrix.vscode_target }})
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_dispatch' && !inputs.identity) ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch != null &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust_target: aarch64-apple-darwin
            vscode_target: darwin-arm64
            archive_ext: tar.xz
            binary_name: sqlsift-lsp
          - rust_target: x86_64-apple-darwin
            vscode_target: darwin-x64
            archive_ext: tar.xz
            binary_name: sqlsift-lsp
          - rust_target: x86_64-unknown-linux-gnu
            vscode_target: linux-x64
            archive_ext: tar.xz
            binary_name: sqlsift-lsp
          - rust_target: aarch64-unknown-linux-gnu
            vscode_target: linux-arm64
            archive_ext: tar.xz
            binary_name: sqlsift-lsp
          - rust_target: x86_64-pc-windows-msvc
            vscode_target: win32-x64
            archive_ext: zip
            binary_name: sqlsift-lsp.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.event.workflow_run.head_branch }}"
          fi
          if [[ -z "$TAG" ]]; then
            echo "::error::A release tag is required unless identity mode is on"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Update extension version
        working-directory: editors/vscode
        run: npm version "${{ steps.tag.outputs.version }}" --no-git-tag-version

      - name: Install dependencies
        working-directory: editors/vscode
        run: npm ci

      - name: Download sqlsift-lsp binary from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARCHIVE="sqlsift-lsp-${{ matrix.rust_target }}.${{ matrix.archive_ext }}"
          gh release download "${{ steps.tag.outputs.tag }}" \
            --pattern "$ARCHIVE" \
            --dir /tmp/download

          mkdir -p /tmp/extracted editors/vscode/bin

          if [[ "${{ matrix.archive_ext }}" == "tar.xz" ]]; then
            tar xf "/tmp/download/$ARCHIVE" -C /tmp/extracted
          else
            unzip "/tmp/download/$ARCHIVE" -d /tmp/extracted
          fi

          BINARY=$(find /tmp/extracted -name "${{ matrix.binary_name }}" -type f | head -1)
          cp "$BINARY" editors/vscode/bin/
          chmod +x "editors/vscode/bin/${{ matrix.binary_name }}"

      - name: Copy LICENSE
        run: cp LICENSE editors/vscode/LICENSE

      - name: Bundle extension
        working-directory: editors/vscode
        run: npm run esbuild

      - name: Build VSIX
        working-directory: editors/vscode
        run: npx @vscode/vsce package --target ${{ matrix.vscode_target }}

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.vscode_target }}
          path: editors/vscode/*.vsix

  release-assets:
    name: Upload VSIX to GitHub Release
    needs: build-vsix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.event.workflow_run.head_branch }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download all VSIX artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          path: vsix/
          merge-multiple: true

      - name: List VSIX files
        run: ls -la vsix/

      - name: Upload VSIX files to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for vsix in vsix/*.vsix; do
            gh release upload "${{ steps.tag.outputs.tag }}" "$vsix" \
              --repo "${{ github.repository }}"
          done

  # Signs in with GitHub OIDC to a Microsoft Entra ID app (no stored token; global
  # Azure DevOps PATs are retired on 2026-12-01). See PUBLISHING.md for the setup.
  marketplace:
    name: Publish to VS Code Marketplace
    needs: build-vsix
    # Run on its own in identity mode, where build-vsix is skipped.
    if: >
      always() && vars.PUBLISH_VSCODE == 'true' &&
      (needs.build-vsix.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.identity))
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    permissions:
      id-token: write
    steps:
      - name: Sign in to Microsoft Entra ID
        uses: azure/login@053f7285eb20bf5469ef084617b0b24d3cec53fc # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # The id to add to the publisher's Members (Contributor). Only readable while
      # signed in as the identity; connectionData works for service principals too.
      - name: Show Marketplace identity
        run: |
          az rest -u "https://app.vssps.visualstudio.com/_apis/connectionData" \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query "authenticatedUser.{id: id, name: providerDisplayName}"

      - name: Verify publish rights
        run: npx -y @vscode/vsce@3 verify-pat --azure-credential sqlsift

      - name: Download all VSIX artifacts
        if: needs.build-vsix.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          path: vsix/
          merge-multiple: true

      - name: Publish to VS Code Marketplace
        if: needs.build-vsix.result == 'success'
        run: npx -y @vscode/vsce@3 publish --azure-credential --skip-duplicate --packagePath vsix/*.vsix
