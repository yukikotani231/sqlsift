name: Code Scanning Demo (sqlsift)

on:
  workflow_dispatch:

jobs:
  sqlsift-code-scanning:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Generate SARIF with sqlsift
        shell: bash
        run: |
          set +e
          cargo run -p sqlsift-cli -- check \
            --schema tests/fixtures/schema.sql \
            -f sarif \
            tests/fixtures/invalid_query.sql > results.sarif
          status=$?
          echo "sqlsift_exit_code=$status"
          if [ ! -s results.sarif ]; then
            echo "SARIF output was empty" >&2
            exit 1
          fi
          exit 0

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
