name: GitHub Action

on:
  push:
    branches: [main]
    paths: ["action.yml", ".github/sqlsift-problem-matcher.json", ".github/workflows/action-test.yml", "crates/**", "tests/fixtures/**"]
  pull_request:
    paths: ["action.yml", ".github/sqlsift-problem-matcher.json", ".github/workflows/action-test.yml", "crates/**", "tests/fixtures/**"]
  workflow_dispatch:

# Read-only token: these jobs only build and test
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-action:
    name: Test action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest"]') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build sqlsift
        run: cargo build -p sqlsift-cli

      - name: Valid queries pass
        uses: ./
        with:
          cli-path: target/debug/sqlsift
          schema: tests/fixtures/schema.sql
          files: tests/fixtures/valid_*.sql

      - name: Baseline hides known errors
        id: baseline
        uses: ./
        with:
          cli-path: target/debug/sqlsift
          schema: tests/fixtures/schema.sql
          files: tests/fixtures/invalid_query.sql
          baseline: tests/fixtures/baseline.json
          sarif-file: baseline.sarif

      - name: Invalid queries are reported
        id: invalid
        uses: ./
        with:
          cli-path: target/debug/sqlsift
          schema: tests/fixtures/schema.sql
          files: tests/fixtures/invalid_query.sql
          sarif-file: results.sarif
          fail-on-error: "false"

      - name: Check outputs
        shell: bash
        run: |
          test "${{ steps.baseline.outputs.exit-code }}" = "0"
          python3 -c "import json; d = json.load(open('baseline.sarif')); assert d['runs'][0]['results'] and all('suppressions' in r for r in d['runs'][0]['results']), 'expected suppressed SARIF results'"
          test "${{ steps.invalid.outputs.exit-code }}" = "1"
          python3 -c "import json; d = json.load(open('results.sarif')); assert d['runs'][0]['results'], 'no SARIF results'"

      # diff-base: only the diagnostics a change introduces are reported.
      # tests/fixtures/action-diff has one existing problem; a commit made here
      # adds a migration that breaks another query.
      - name: Record the base commit
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: "diff-base: existing problems are not reported"
        uses: ./
        with:
          cli-path: target/debug/sqlsift
          schema-dir: tests/fixtures/action-diff/db
          files: tests/fixtures/action-diff/queries/*.sql
          diff-base: ${{ steps.base.outputs.sha }}

      - name: Add a migration that breaks a query
        shell: bash
        run: |
          echo "ALTER TABLE users DROP COLUMN email;" > tests/fixtures/action-diff/db/002_drop_email.sql
          git add tests/fixtures/action-diff/db/002_drop_email.sql
          git -c user.name=ci -c user.email=ci@example.com commit --quiet -m "drop email"

      - name: "diff-base: the new problem is reported"
        id: diff
        uses: ./
        with:
          cli-path: target/debug/sqlsift
          schema-dir: tests/fixtures/action-diff/db
          files: tests/fixtures/action-diff/queries/*.sql
          diff-base: ${{ steps.base.outputs.sha }}
          sarif-file: diff.sarif
          fail-on-error: "false"

      - name: "impact: what the new migration breaks is reported"
        id: impact
        uses: ./
        with:
          cli-path: target/debug/sqlsift
          mode: impact
          schema-dir: tests/fixtures/action-diff/db
          files: tests/fixtures/action-diff/queries/*.sql
          diff-base: ${{ steps.base.outputs.sha }}
          sarif-file: impact.sarif
          fail-on-error: "false"

      - name: "Without diff-base every problem is reported"
        id: full
        uses: ./
        with:
          cli-path: target/debug/sqlsift
          schema-dir: tests/fixtures/action-diff/db
          files: tests/fixtures/action-diff/queries/*.sql
          sarif-file: full.sarif
          fail-on-error: "false"

      - name: Check diff-base outputs
        shell: bash
        run: |
          test "${{ steps.diff.outputs.exit-code }}" = "1"
          test "${{ steps.full.outputs.exit-code }}" = "1"
          test "${{ steps.impact.outputs.exit-code }}" = "1"
          python3 - <<'EOF'
          import json
          diff = json.load(open('diff.sarif'))['runs'][0]['results']
          full = json.load(open('full.sarif'))['runs'][0]['results']
          # The base's diagnostics are there too, as suppressed results
          new = [r for r in diff if 'suppressions' not in r]
          assert len(new) == 1 and "'email'" in new[0]['message']['text'], diff
          assert len(diff) == 2, diff
          assert len(full) == 2, full
          impact = json.load(open('impact.sarif'))['runs'][0]['results']
          assert len(impact) == 1 and "'email'" in impact[0]['message']['text'], impact
          EOF
          # The temporary worktree and baseline are cleaned up
          test "$(git worktree list | wc -l)" -eq 1
          ! git status --porcelain --untracked-files=all | grep sqlsift-diff-baseline
