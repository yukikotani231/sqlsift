# cargo-deny: license check of the dependency tree (CI job "Licenses").
# Only permissive licenses are allowed, so a copyleft dependency fails CI
# instead of reaching the MIT-licensed binaries, the npm package and the VSIX.
# Run locally with `cargo deny check licenses`.

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
ignore = true
